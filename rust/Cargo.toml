[package]
name = "handlist"
version = "1.0.0"
edition = "2024"
authors = ["stackinspector"]
license = "MPL-2.0"
repository = "https://github.com/Berylsoft/handlist"
description = "A strict, human-friendly subset of YAML for hand-edited configuration files"
keywords = ["yaml", "config", "parser", "serde", "data"]
categories = ["parser-implementations", "config", "encoding"]
readme = "../README.md"

[features]
default = ["serde"]
serde = ["dep:serde"]
format = []
schema = ["dep:jsonschema", "dep:serde_json", "serde"]
cli = ["dep:argh", "schema", "format"]

[dependencies]
argh = { version = "0.1.19", optional = true }
jsonschema = { version = "0.28.3", default-features = false, optional = true }
serde = { version = "1.0", optional = true, default-features = false, features = ["std"] }
serde_json = { version = "1.0", optional = true }

[[bin]]
name = "handlist"
path = "src/bin/handlist.rs"
required-features = ["cli"]

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
